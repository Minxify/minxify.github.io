  intro: "\u3053\u306e\u30da\u30fc\u30b8\u304c\u30d7\u30ea\u30f3\u30bf\u3067\u5370\u5237\u3055\u308c\u305f\u3068\u3044\u3046\u3053\u3068\u306f\u3001\u30d7\u30ea\u30f3\u30bf\u304c\u30dd\u30fc\u30c89100\uff08RAW TCP\u5370\u5237\uff09\u7d4c\u7531\u3067\u30a4\u30f3\u30bf\u30fc\u30cd\u30c3\u30c8\u306b\u9732\u51fa\u3057\u3066\u3044\u307e\u3059\u3002\u653b\u6483\u8005\u3084\u30dc\u30c3\u30c8\u3001\u7b2c\u4e09\u8005\u304b\u3089\u5370\u5237\u30b8\u30e7\u30d6\u3092\u9001\u3089\u308c\u3001\u7d19\u3084\u30c8\u30ca\u30fc\u3092\u7121\u99c4\u306b\u3055\u308c\u305f\u308a\u3001\u4ed6\u306e\u653b\u6483\u306b\u4f7f\u308f\u308c\u305f\u308a\u3059\u308b\u53ef\u80fd\u6027\u304c\u3042\u308a\u307e\u3059\u3002\u5e78\u3044\u3001\u3053\u308c\u306f\u7c21\u5358\u306b\u76f4\u305b\u307e\u3059\u3002",
  steps: [
    {h: "UPnP\u3092\u7121\u52b9\u306b\u3059\u308b", b: "\u30eb\u30fc\u30bf\u30fc\u306e\u7ba1\u7406\u753b\u9762\uff08\u901a\u5e38 http://192.168.1.1 \u307e\u305f\u306f http://192.168.0.1\uff09\u306b\u30ed\u30b0\u30a4\u30f3\u3057\u3001\u300cUPnP\u300d\u3092\u63a2\u3057\u3066\u30aa\u30d5\u306b\u3057\u307e\u3059\u3002UPnP\u306f\u6a5f\u5668\u304c\u30eb\u30fc\u30bf\u30fc\u306e\u30dd\u30fc\u30c8\u3092\u81ea\u52d5\u3067\u958b\u653e\u3059\u308b\u6a5f\u80fd\u3067\u3001\u307e\u3055\u306b\u3053\u308c\u304c\u30d7\u30ea\u30f3\u30bf\u304c\u9732\u51fa\u3057\u3066\u3057\u307e\u3046\u539f\u56e0\u3067\u3059\u3002"},
    {h: "\u30dd\u30fc\u30c8\u8ee2\u9001\u306e\u30eb\u30fc\u30eb\u3092\u524a\u9664\u3059\u308b", b: "\u30eb\u30fc\u30bf\u30fc\u7ba1\u7406\u753b\u9762\u3067\u300c\u30dd\u30fc\u30c8\u8ee2\u9001\u300d\u300c\u30d0\u30fc\u30c1\u30e3\u30eb\u30b5\u30fc\u30d0\u30fc\u300d\u300cNAT\u300d\u3092\u63a2\u3057\u30019100\uff08\u304a\u3088\u3073515\u3001631\uff09\u3092\u30d7\u30ea\u30f3\u30bf\u306b\u8ee2\u9001\u3059\u308b\u30eb\u30fc\u30eb\u3092\u3059\u3079\u3066\u524a\u9664\u3057\u307e\u3059\u3002\u30d7\u30ea\u30f3\u30bf\u304c\u300cDMZ\u300d\u306b\u8a2d\u5b9a\u3055\u308c\u3066\u3044\u308b\u5834\u5408\u3082\u89e3\u9664\u3057\u307e\u3059\u3002"},
    {h: "\u30d7\u30ea\u30f3\u30bf\u81ea\u4f53\u3092\u4fdd\u8b77\u3059\u308b", b: "\u30d7\u30ea\u30f3\u30bf\u306e\u8a2d\u5b9a\u753b\u9762\u3092\u958b\u304d\u307e\u3059\uff08\u30eb\u30fc\u30bf\u30fc\u306e\u30af\u30e9\u30a4\u30a2\u30f3\u30c8\u4e00\u89a7\u3067IP\u3092\u78ba\u8a8d\u3059\u308b\u304b\u3001\u30cd\u30c3\u30c8\u30ef\u30fc\u30af\u30b9\u30c6\u30fc\u30bf\u30b9\u30da\u30fc\u30b8\u3092\u5370\u5237\uff09\u3002\u7ba1\u7406\u8005\u30d1\u30b9\u30ef\u30fc\u30c9\u3092\u5909\u66f4\u3057\u3001\u6700\u65b0\u306e\u30d5\u30a1\u30fc\u30e0\u30a6\u30a7\u30a2\u3092\u9069\u7528\u3057\u3001\u300cIP\u30d5\u30a3\u30eb\u30bf\u30fc\u300d\u300c\u30a2\u30af\u30bb\u30b9\u5236\u5fa1\u300d\u300c\u30ea\u30e2\u30fc\u30c8\u7ba1\u7406\u300d\u304c\u3042\u308c\u3070\u3001\u30ed\u30fc\u30ab\u30eb\u30cd\u30c3\u30c8\u30ef\u30fc\u30af\u306e\u307f\u8a31\u53ef\u3057WAN\u304b\u3089\u306e\u30a2\u30af\u30bb\u30b9\u3092\u7121\u52b9\u306b\u3057\u307e\u3059\u3002"},
    {h: "\u5916\u90e8\u304b\u3089\u5370\u5237\u3059\u308b\u5834\u5408\u306f\u5b89\u5168\u306a\u65b9\u6cd5\u3092", b: "\u51fa\u5916\u5148\u304b\u3089\u5370\u5237\u3059\u308b\u5fc5\u8981\u304c\u3042\u308b\u306a\u3089\u3001\u751f\u306e\u30dd\u30fc\u30c8\u3092\u8ee2\u9001\u305b\u305a\u3001\u30e1\u30fc\u30ab\u30fc\u306e\u30af\u30e9\u30a6\u30c9\u5370\u5237\u3092\u4f7f\u3046\u304b\u3001VPN\uff08WireGuard/OpenVPN\uff09\u3092\u8a2d\u5b9a\u3057\u3066VPN\u7d4c\u7531\u3067\u306e\u307f\u5370\u5237\u3057\u307e\u3059\u3002"},
    {h: "\u30d7\u30ea\u30f3\u30bf\u3092\u5c02\u7528\u30cd\u30c3\u30c8\u30ef\u30fc\u30af\u306b\u7f6e\u304f", b: "\u30eb\u30fc\u30bf\u30fc\u304c\u5bfe\u5fdc\u3057\u3066\u3044\u308c\u3070\u3001IoT\u6a5f\u5668\u7528\u306e\u5225\u30cd\u30c3\u30c8\u30ef\u30fc\u30af\uff08\u30b2\u30b9\u30c8\u30cd\u30c3\u30c8\u30ef\u30fc\u30af\u3084VLAN\uff09\u3092\u4f5c\u308a\u3001\u30d7\u30ea\u30f3\u30bf\u3092\u305d\u3053\u306b\u63a5\u7d9a\u3057\u307e\u3059\u3002\u56fa\u5b9aIP\u3092\u5272\u308a\u5f53\u3066\u3001\u30dd\u30fc\u30c8\u8ee2\u9001\u304c\u5411\u3044\u3066\u3044\u306a\u3044\u3053\u3068\u3092\u78ba\u8a8d\u3057\u307e\u3059\u3002"}
  ],
  close: "\u4ee5\u4e0a\u3067\u3059\u3002\u30085\u5206\u306e\u8a2d\u5b9a\u5909\u66f4\u3067\u3001\u30d7\u30ea\u30f3\u30bf\u306f\u3082\u3046\u8ab0\u3067\u3082\u4f7f\u3048\u308b\u72b6\u614b\u3067\u306f\u3042\u308a\u307e\u305b\u3093\u3002IT\u90e8\u9580\u304c\u3044\u308b\u5834\u5408\u306f\u3053\u306e\u30da\u30fc\u30b8\u3092\u5171\u6709\u3057\u3066\u304f\u3060\u3055\u3044\u3002\u2014\u2014Friendly catgirl hacker:3"
},
"ko": {
  dir: "ltr",
  name: "\ud55c\uad6d\uc5b4",
  t: "\uc778\ud130\ub137\uc5d0\uc11c \ud504\ub9b0\ud130\ub97c \ubcf4\ud638\ud558\ub294 \ubc29\ubc95",
  sub: "\ud3ec\ud2b8 9100\uacfc \ub77c\uc6b0\ud130 UPnP\ub97c \uc7a0\uadf8\ub294 \uac04\ub2e8\ud55c \uac00\uc774\ub4dc",
  intro: "\uc774 \ud398\uc774\uc9c0\uac00 \ud504\ub9b0\ud130\uc5d0\uc11c \ucd9c\ub825\ub418\uc5c8\ub2e4\uba74, \ud504\ub9b0\ud130\uac00 \ud3ec\ud2b8 9100(RAW TCP \uc778\uc1c4)\uc744 \ud1b5\ud574 \uacf5\uac1c \uc778\ud130\ub137\uc5d0 \ub178\ucd9c\ub418\uc5b4 \uc788\ub2e4\ub294 \ub73b\uc785\ub2c8\ub2e4. \uacf5\uaca9\uc790\ub098 \ubcf4\ud2b8, \ub0ae\uc120 \uc0ac\ub78c\uc774 \uc778\uc1c4 \uc791\uc5c5\uc744 \ubcf4\ub0b4 \uc885\uc774\uc640 \ud1a0\ub108\ub97c \ub0ad\ube44\ud558\uac70\ub098 \ub2e4\ub978 \uacf5\uaca9\uc5d0 \uc545\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \uc88b\uc740 \uc18c\uc2dd\uc740 \uc26d\uac8c \uace0\uce60 \uc218 \uc788\ub2e4\ub294 \uac83\uc785\ub2c8\ub2e4.",
  steps: [
    {h: "UPnP \uaed0\uae30", b: "\ub77c\uc6b0\ud130 \uad00\ub9ac \ud398\uc774\uc9c0(\ubcf4\ud1b5 http://192.168.1.1 \ub610\ub294 http://192.168.0.1)\uc5d0 \ub85c\uadf8\uc778\ud574 'UPnP'\ub97c \ucc3e\uc544 \uaed0\uc138\uc694. UPnP\ub294 \ub124\ud2b8\uc6cc\ud06c \uae30\uae30\uac00 \ub77c\uc6b0\ud130\uc758 \ud3ec\ud2b8\ub97c \uc790\ub3d9\uc73c\ub85c \uc5f4\uac8c \ud558\ub294 \uae30\ub2a5\uc73c\ub85c, \ud504\ub9b0\ud130\uac00 \ub178\ucd9c\ub418\ub294 \ubc14\ub85c \uadf8 \uc6d0\uc778\uc785\ub2c8\ub2e4."},
    {h: "\ud3ec\ud2b8 \ud3ec\uc6cc\ub529 \uaddc\uce59 \uc81c\uac70", b: "\ub77c\uc6b0\ud130 \uad00\ub9ac \ud398\uc774\uc9c0\uc5d0\uc11c 'Port Forwarding', 'Virtual Server', 'NAT'\ub97c \ucc3e\uc544 \ud3ec\ud2b8 9100(\uadf8\ub9ac\uace0 515, 631)\uc744 \ud504\ub9b0\ud130\ub85c \ubcf4\ub0b4\ub294 \uaddc\uce59\uc744 \ubaa8\ub450 \uc0ad\uc81c\ud558\uc138\uc694. \ud504\ub9b0\ud130\uac00 'DMZ'\uc5d0 \uc788\ub2e4\uba74 \uadf8\uac83\ub3c4 \uc81c\uac70\ud558\uc138\uc694."},
    {h: "\ud504\ub9b0\ud130 \uc790\uccb4\ub97c \uc7a0\uadf8\uae30", b: "\ud504\ub9b0\ud130 \uc124\uc815 \ud398\uc774\uc9c0\ub97c \uc5ec\uc138\uc694(\ub77c\uc6b0\ud130\uc758 \ud074\ub77c\uc774\uc5b8\ud2b8 \ubaa9\ub85d\uc5d0\uc11c IP\ub97c \ucc3e\uac70\ub098 \ub124\ud2b8\uc6cc\ud06c \uc0c1\ud0dc \ud398\uc774\uc9c0\ub97c \uc778\uc1c4). \uad00\ub9ac\uc790 \ube44\ubc00\ubc88\ud638\ub97c \ubc14\uafb8\uace0 \ucd5c\uc2e0 \ud38c\uc6e8\uc5b4\ub97c \uc124\uce58\ud558\uba70, 'IP \ud544\ud130', '\uc561\uc138\uc2a4 \uc81c\uc5b4', '\uc6d0\uaca9 \uad00\ub9ac' \uae30\ub2a5\uc774 \uc788\uc73c\uba74 \ub85c\uceec \ub124\ud2b8\uc6cc\ud06c\ub9cc \ud5c8\uc6a9\ud558\uace0 WAN\uc5d0\uc11c\uc758 \uc811\uadfc\uc744 \ucc28\ub2e8\ud558\uc138\uc694."},
    {h: "\uc678\ubd80\uc5d0\uc11c\ub294 \uc548\uc804\ud55c \ubc29\ubc95\uc73c\ub85c \uc778\uc1c4", b: "\uc9d1 \ubc16\uc5d0\uc11c \uc778\uc1c4\ud574\uc57c \ud55c\ub2e4\uba74 \uc6d0\uc2dc \ud3ec\ud2b8\ub97c \uc5f4\uc9c0 \ub9c8\uc138\uc694. \uc81c\uc870\uc0ac\uc758 \ud074\ub77c\uc6b0\ub4dc \uc778\uc1c4\ub97c \uc0ac\uc6a9\ud558\uac70\ub098 VPN(WireGuard/OpenVPN)\uc744 \uc124\uc815\ud558\uace0 VPN\uc744 \ud1b5\ud574\uc11c\ub9cc \uc778\uc1c4\ud558\uc138\uc694."},
    {h: "\ud504\ub9b0\ud130\ub97c \ubcc4\ub3c4 \ub124\ud2b8\uc6cc\ud06c\uc5d0 \ubc30\uce58", b: "\ub77c\uc6b0\ud130\uac00 \uc9c0\uc6d0\ud55c\ub2e4\uba74 IoT \uae30\uae30\uc6a9\uc73c\ub85c \ubcc4\ub3c4\uc758 \ub124\ud2b8\uc6cc\ud06c(\uac8c\uc2a4\ud2b8 \ub610\ub294 VLAN)\ub97c \ub9cc\ub4e4\uace0 \ud504\ub9b0\ud130\ub97c \uadf8\uacf3\uc5d0 \uc5f0\uacb0\ud558\uc138\uc694. \uace0\uc815 IP\ub97c \uc8fc\uace0 \uc5b4\ub5a4 \ud3ec\ud2b8 \ud3ec\uc6cc\ub529\ub3c4 \ud504\ub9b0\ud130\ub97c \uac00\ub9ac\ud0a4\uc9c0 \uc54a\uac8c \ud558\uc138\uc694."}
  ],
  close: "\uc774\uac83\uc73c\ub85c \ub05d\uc785\ub2c8\ub2e4. 5\ubd84\ub9cc \uc124\uc815\uc744 \ubc14\uafb8\uba74 \ud504\ub9b0\ud130\ub294 \ub354 \uc774\uc0c1 \uacf5\uc6a9\uc774 \uc544\ub2d9\ub2c8\ub2e4. IT \ubd80\uc11c\uac00 \uc788\ub2e4\uba74 \uc774 \ud398\uc774\uc9c0\ub97c \uacf5\uc720\ud558\uc138\uc694. \u2014 Friendly catgirl hacker:3"
},
"es": {
  dir: "ltr",
  name: "Espa\u00f1ol",
  t: "C\u00f3mo asegurar tu impresora frente a Internet",
  sub: "Gu\u00eda r\u00e1pida para bloquear el puerto 9100 y el UPnP de tu router",
  intro: "Si esta p\u00e1gina apareci\u00f3 en tu impresora, tu impresora es accesible desde Internet p\u00fablico a trav\u00e9s del puerto 9100 (impresi\u00f3n TCP). Atacantes, bots o desconocidos pueden enviar trabajos de impresi\u00f3n, gastar papel y tinta, o usarla en otros ataques. La buena noticia: es f\u00e1cil de arreglar.",
  steps: [
    {h: "Apaga UPnP", b: "Entra a la p\u00e1gina de administraci\u00f3n de tu router (normalmente http://192.168.1.1 o http://192.168.0.1), busca \u201cUPnP\u201d y desact\u00edvalo. UPnP permite que los dispositivos abran puertos autom\u00e1ticamente en tu router \u2014 as\u00ed es exactamente como las impresoras terminan expuestas."},
    {h: "Elimina las reglas de redirecci\u00f3n de puertos", b: "En la administraci\u00f3n del router busca \u201cRedirecci\u00f3n de puertos\u201d, \u201cServidor virtual\u201d o \u201cNAT\u201d. Borra cualquier regla que reenv\u00ede el puerto 9100 (y 515, 631) a tu impresora. Si la impresora est\u00e1 en \u201cDMZ\u201d, qu\u00edtala tambi\u00e9n."},
    {h: "Protege la impresora", b: "Abre la p\u00e1gina de configuraci\u00f3n de la impresora (encuentra su IP en la lista de clientes del router, o imprime una p\u00e1gina de estado de red). Cambia la contrase\u00f1a de administrador, instala el \u00faltimo firmware y, si tiene \u201cFiltrado de IP\u201d, \u201cControl de acceso\u201d o \u201cAdministraci\u00f3n remota\u201d, permite solo tu red local y desactiva el acceso desde la WAN."},
    {h: "Usa una forma segura de imprimir desde fuera", b: "Si necesitas imprimir desde fuera de casa, no reenv\u00edes puertos. Usa la impresi\u00f3n en la nube del fabricante o configura una VPN (WireGuard/OpenVPN) e imprime solo a trav\u00e9s de la VPN."},
    {h: "Pon la impresora en su propia red", b: "Si tu router lo permite, crea una red separada (invitados o VLAN) para dispositivos IoT y conecta la impresora ah\u00ed. Ponle una IP fija y aseg\u00farate de que ning\u00fan reenv\u00edo de puertos apunte a ella."}
  ],
  close: "Eso es todo. Cinco minutos de cambios y tu impresora ya no es de uso p\u00fablico. Si tienes equipo t\u00e9cnico, p\u00e1sale esta p\u00e1gina. \u2014 Friendly catgirl hacker:3"
},
"fr": {
  dir: "ltr",
  name: "Fran\u00e7ais",
  t: "Comment s\u00e9curiser votre imprimante contre Internet",
  sub: "Guide rapide pour verrouiller le port 9100 et l'UPnP de votre routeur",
  intro: "Si cette page est apparue sur votre imprimante, c'est qu'elle est accessible depuis Internet public via le port 9100 (impression TCP brute). Des attaquants, des robots ou des inconnus peuvent y envoyer des impressions, gaspiller du papier et de l'encre, ou s'en servir pour d'autres attaques. Bonne nouvelle : c'est facile \u00e0 corriger.",
  steps: [
    {h: "D\u00e9sactivez l'UPnP", b: "Connectez-vous \u00e0 l'interface de votre routeur (g\u00e9n\u00e9ralement http://192.168.1.1 ou http://192.168.0.1), trouvez \u201cUPnP\u201d et \u00e9teignez-le. L'UPnP permet aux appareils d'ouvrir des ports automatiquement sur votre routeur \u2014 c'est exactement comme \u00e7a que les imprimantes se retrouvent expos\u00e9es."},
    {h: "Supprimez les redirections de ports", b: "Dans l'interface, cherchez \u201cRedirection de ports\u201d, \u201cServeur virtuel\u201d ou \u201cNAT\u201d. Supprimez toute r\u00e8gle qui envoie le port 9100 (et 515, 631) vers votre imprimante. Si l'imprimante est dans la zone \u201cDMZ\u201d, retirez-la aussi."},
    {h: "Prot\u00e9gez l'imprimante elle-m\u00eame", b: "Ouvrez la page de configuration de l'imprimante (trouvez son IP dans la liste des clients du routeur, ou imprimez une page d'\u00e9tat r\u00e9seau). Changez le mot de passe admin, installez le dernier firmware, et si elle a un \u201cFiltrage IP\u201d, un \u201cContr\u00f4le d'acc\u00e8s\u201d ou une \u201cAdministration \u00e0 distance\u201d, n'autorisez que votre r\u00e9seau local et bloquez l'acc\u00e8s depuis le WAN."},
    {h: "Imprimez depuis l'ext\u00e9rieur de fa\u00e7on s\u00fbre", b: "Si vous devez imprimer depuis l'ext\u00e9rieur, ne redirigez pas de ports. Utilisez l'impression cloud du fabricant, ou installez un VPN (WireGuard/OpenVPN) et imprimez uniquement via le VPN."},
    {h: "Mettez l'imprimante sur son propre r\u00e9seau", b: "Si votre routeur le permet, cr\u00e9ez un r\u00e9seau s\u00e9par\u00e9 (invit\u00e9s ou VLAN) pour les objets connect\u00e9s et branchez-y l'imprimante. Donnez-lui une IP fixe et assurez-vous qu'aucun port n'est redirig\u00e9 vers elle."}
  ],
  close: "Voil\u00e0, c'est tout. Cinq minutes de r\u00e9glages et votre imprimante n'est plus un bien public. Si vous avez une \u00e9quipe technique, envoyez-leur cette page. \u2014 Friendly catgirl hacker:3"
},
"de": {

  intro: "Wenn diese Seite auf Ihrem Drucker erschienen ist, ist Ihr Drucker \u00fcber Port 9100 (Raw-TCP-Druck) aus dem \u00f6ffentlichen Internet erreichbar. Angreifer, Bots oder Fremde k\u00f6nnen Druckauftr\u00e4ge senden, Papier und Toner verschwenden oder ihn f\u00fcr weitere Angriffe missbrauchen. Gute Nachricht: Das l\u00e4sst sich leicht beheben.",
  steps: [
    {h: "UPnP ausschalten", b: "Melden Sie sich in der Router-Administration an (meist http://192.168.1.1 oder http://192.168.0.1), suchen Sie \u201cUPnP\u201d und schalten Sie es aus. UPnP erlaubt Ger\u00e4ten, automatisch Ports im Router zu \u00f6ffnen \u2013 genau so werden Drucker versehentlich exponiert."},
    {h: "Port-Weiterleitungen entfernen", b: "Suchen Sie in der Router-Administration nach \u201cPortweiterleitung\u201d, \u201cVirtueller Server\u201d oder \u201cNAT\u201d. L\u00f6schen Sie jede Regel, die Port 9100 (und 515, 631) an Ihren Drucker weiterleitet. Steht der Drucker in der \u201cDMZ\u201d, entfernen Sie ihn auch dort."},
    {h: "Den Drucker selbst absichern", b: "\u00d6ffnen Sie die Einstellungen des Druckers (IP in der Client-Liste des Routers finden oder Netzwerkstatus-Seite drucken). \u00c4ndern Sie das Admin-Passwort, installieren Sie die neueste Firmware, und falls es \u201cIP-Filter\u201d, \u201cZugriffskontrolle\u201d oder \u201cRemote-Verwaltung\u201d gibt, erlauben Sie nur Ihr lokales Netz und blockieren Sie Zugriff von au\u00dfen."},
    {h: "Sicher von au\u00dfen drucken", b: "Wenn Sie wirklich von unterwegs drucken m\u00fcssen, leiten Sie keine rohen Ports weiter. Nutzen Sie das Cloud-Drucken des Herstellers oder richten Sie ein VPN ein (WireGuard/OpenVPN) und drucken Sie nur \u00fcber das VPN."},
    {h: "Drucker ins eigene Netz", b: "Wenn Ihr Router es kann, richten Sie ein separates Netz (Gast- oder VLAN) f\u00fcr IoT-Ger\u00e4te ein und schlie\u00dfen Sie den Drucker dort an. Vergeben Sie eine feste IP und stellen Sie sicher, dass keine Weiterleitung auf ihn zeigt."}
  ],
  close: "Das war's. F\u00fcnf Minuten Einstellungen und Ihr Drucker ist kein Freiwild mehr. Wenn Sie ein IT-Team haben, schicken Sie ihm diese Seite. \u2014 Friendly catgirl hacker:3"
},
"it": {

  sub: "Breve guida per bloccare la porta 9100 e l'UPnP del router",
  intro: "Se questa pagina \u00e8 apparsa sulla tua stampante, significa che la stampante \u00e8 raggiungibile da Internet tramite la porta 9100 (stampa TCP grezza). Attaccanti, bot o estranei possono inviarle lavori di stampa, sprecare carta e toner, o usarla per altri attacchi. Buona notizia: si risolve facilmente.",
  steps: [

    {h: "Rimuovi le regole di inoltro porte", b: "Nell'amministrazione del router cerca \u201cInoltro porte\u201d, \u201cServer virtuale\u201d o \u201cNAT\u201d. Elimina qualsiasi regola che inoltri la porta 9100 (e 515, 631) verso la stampante. Se la stampante \u00e8 nella \u201cDMZ\u201d, rimuovila anche da l\u00ec."},
    {h: "Blocca la stampante stessa", b: "Apri la pagina delle impostazioni della stampante (trova il suo IP nell'elenco clienti del router, oppure stampa una pagina di stato di rete). Cambia la password di amministratore, installa l'ultimo firmware e, se ha \u201cFiltro IP\u201d, \u201cControllo accessi\u201d o \u201cGestione remota\u201d, consenti solo la tua rete locale e disabilita l'accesso dalla WAN."},
    {h: "Usa un modo sicuro per stampare da fuori", b: "Se ti serve stampare da fuori casa, non inoltrare porte grezze. Usa la stampa cloud del produttore, oppure configura una VPN (WireGuard/OpenVPN) e stampa solo tramite VPN."},
    {h: "Metti la stampante nella sua rete", b: "Se il router lo supporta, crea una rete separata (ospiti o VLAN) per i dispositivi IoT e collegaci la stampante. Dagli un IP statico e assicurati che nessun inoltro porte punti su di essa."}
  ],
  close: "Tutto qui. Cinque minuti di impostazioni e la stampante non \u00e8 pi\u00f9 un bene pubblico. Se hai un reparto IT, inviagli questa pagina. \u2014 Friendly catgirl hacker:3"
},
"pt": {
  dir: "ltr",
  name: "Portugu\u00eas",
  t: "Como proteger sua impressora da Internet",
  sub: "Guia r\u00e1pido para bloquear a porta 9100 e o UPnP do roteador",
  intro: "Se esta p\u00e1gina apareceu na sua impressora, sua impressora est\u00e1 acess\u00edvel pela Internet p\u00fablica pela porta 9100 (impress\u00e3o TCP bruta). Atacantes, bots ou estranhos podem enviar trabalhos de impress\u00e3o, gastar papel e tinta, ou us\u00e1-la em outros ataques. Boa not\u00edcia: \u00e9 f\u00e1cil de resolver.",
  steps: [
    {h: "Desligue o UPnP", b: "Entre na p\u00e1gina de administra\u00e7\u00e3o do roteador (geralmente http://192.168.1.1 ou http://192.168.0.1), encontre \u201cUPnP\u201d e desative. O UPnP permite que dispositivos abram portas automaticamente no roteador \u2014 \u00e9 exatamente assim que impressoras acabam expostas."},
    {h: "Remova regras de redirecionamento de porta", b: "Na administra\u00e7\u00e3o do roteador, procure \u201cRedirecionamento de portas\u201d, \u201cServidor virtual\u201d ou \u201cNAT\u201d. Apague qualquer regra que envie a porta 9100 (e 515, 631) para a impressora. Se a impressora estiver na \u201cDMZ\u201d, remova-a tamb\u00e9m."},
    {h: "Proteja a pr\u00f3pria impressora", b: "Abra a p\u00e1gina de configura\u00e7\u00f5es da impressora (descubra o IP na lista de clientes do roteador ou imprima uma p\u00e1gina de status de rede). Mude a senha de administrador, instale o firmware mais recente e, se houver \u201cFiltro de IP\u201d, \u201cControle de acesso\u201d ou \u201cGerenciamento remoto\u201d, permita apenas sua rede local e desative o acesso pela WAN."},
    {h: "Use uma forma segura de imprimir de fora", b: "Se precisar imprimir fora de casa, n\u00e3o encaminhe portas brutas. Use a impress\u00e3o em nuvem do fabricante ou configure uma VPN (WireGuard/OpenVPN) e imprima apenas pela VPN."},
    {h: "Coloque a impressora em sua pr\u00f3pria rede", b: "Se o roteador suportar, crie uma rede separada (convidados ou VLAN) para dispositivos IoT e conecte a impressora nela. D\u00ea um IP fixo e garanta que nenhum redirecionamento de porta aponte para ela."}
  ],
  close: "\u00c9 isso. Cinco minutos de mudan\u00e7as e sua impressora n\u00e3o \u00e9 mais de uso p\u00fablico. Se houver equipe t\u00e9cnica, envie esta p\u00e1gina. \u2014 Friendly catgirl hacker:3"
},
"ru": {
  dir: "ltr",
  name: "\u0420\u0443\u0441\u0441\u043a\u0438\u0439",
  t: "\u041a\u0430\u043a \u0437\u0430\u0449\u0438\u0442\u0438\u0442\u044c \u043f\u0440\u0438\u043d\u0442\u0435\u0440 \u043e\u0442 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430",
  sub: "\u041a\u0440\u0430\u0442\u043a\u043e\u0435 \u0440\u0443\u043a\u043e\u0432\u043e\u0434\u0441\u0442\u0432\u043e \u043f\u043e \u0431\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u043a\u0435 \u043f\u043e\u0440\u0442\u0430 9100 \u0438 UPnP \u043d\u0430 \u0440\u043e\u0443\u0442\u0435\u0440\u0435",
  intro: "\u0415\u0441\u043b\u0438 \u044d\u0442\u0430 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0430 \u043f\u043e\u044f\u0432\u0438\u043b\u0430\u0441\u044c \u043d\u0430 \u0432\u0430\u0448\u0435\u043c \u043f\u0440\u0438\u043d\u0442\u0435\u0440\u0435, \u0437\u043d\u0430\u0447\u0438\u0442 \u043f\u0440\u0438\u043d\u0442\u0435\u0440 \u0434\u043e\u0441\u0442\u0443\u043f\u0435\u043d \u0438\u0437 \u043f\u0443\u0431\u043b\u0438\u0447\u043d\u043e\u0433\u043e \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430 \u0447\u0435\u0440\u0435\u0437 \u043f\u043e\u0440\u0442 9100 (\u0441\u044b\u0440\u0430\u044f TCP-\u043f\u0435\u0447\u0430\u0442\u044c). \u0417\u043b\u043e\u0443\u043c\u044b\u0448\u043b\u0435\u043d\u043d\u0438\u043a\u0438, \u0431\u043e\u0442\u044b \u0438\u043b\u0438 \u043f\u043e\u0441\u0442\u043e\u0440\u043e\u043d\u043d\u0438\u0435 \u043c\u043e\u0433\u0443\u0442 \u043e\u0442\u043f\u0440\u0430\u0432\u043b\u044f\u0442\u044c \u043d\u0430 \u043d\u0435\u0433\u043e \u0437\u0430\u0434\u0430\u043d\u0438\u044f \u043f\u0435\u0447\u0430\u0442\u0438, \u0442\u0440\u0430\u0442\u0438\u0442\u044c \u0431\u0443\u043c\u0430\u0433\u0443 \u0438 \u0442\u043e\u043d\u0435\u0440 \u0438\u043b\u0438 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u044c \u0435\u0433\u043e \u0432 \u0434\u0440\u0443\u0433\u0438\u0445 \u0430\u0442\u0430\u043a\u0430\u0445. \u0425\u043e\u0440\u043e\u0448\u0430\u044f \u043d\u043e\u0432\u043e\u0441\u0442\u044c: \u044d\u0442\u043e \u043b\u0435\u0433\u043a\u043e \u0438\u0441\u043f\u0440\u0430\u0432\u0438\u0442\u044c.",
  steps: [
    {h: "\u041e\u0442\u043a\u043b\u044e\u0447\u0438\u0442\u0435 UPnP", b: "\u0417\u0430\u0439\u0434\u0438\u0442\u0435 \u0432 \u043f\u0430\u043d\u0435\u043b\u044c \u0443\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0440\u043e\u0443\u0442\u0435\u0440\u043e\u043c (\u043e\u0431\u044b\u0447\u043d\u043e http://192.168.1.1 \u0438\u043b\u0438 http://192.168.0.1), \u043d\u0430\u0439\u0434\u0438\u0442\u0435 \u00abUPnP\u00bb \u0438 \u0432\u044b\u043a\u043b\u044e\u0447\u0438\u0442\u0435 \u0435\u0433\u043e. UPnP \u043f\u043e\u0437\u0432\u043e\u043b\u044f\u0435\u0442 \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0430\u043c \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u0442\u044c \u043f\u043e\u0440\u0442\u044b \u043d\u0430 \u0440\u043e\u0443\u0442\u0435\u0440\u0435 \u2014 \u0438\u043c\u0435\u043d\u043d\u043e \u0442\u0430\u043a \u043f\u0440\u0438\u043d\u0442\u0435\u0440\u044b \u0438 \u043e\u043a\u0430\u0437\u044b\u0432\u0430\u044e\u0442\u0441\u044f \u0432 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0435."},
    {h: "\u0423\u0434\u0430\u043b\u0438\u0442\u0435 \u043f\u0440\u0430\u0432\u0438\u043b\u0430 \u043f\u0440\u043e\u0431\u0440\u043e\u0441\u0430 \u043f\u043e\u0440\u0442\u043e\u0432", b: "\u0412 \u043f\u0430\u043d\u0435\u043b\u0438 \u0440\u043e\u0443\u0442\u0435\u0440\u0430 \u043d\u0430\u0439\u0434\u0438\u0442\u0435 \u00ab\u041f\u0440\u043e\u0431\u0440\u043e\u0441 \u043f\u043e\u0440\u0442\u043e\u0432\u00bb, \u00ab\u0412\u0438\u0440\u0442\u0443\u0430\u043b\u044c\u043d\u044b\u0439 \u0441\u0435\u0440\u0432\u0435\u0440\u00bb \u0438\u043b\u0438 \u00abNAT\u00bb. \u0423\u0434\u0430\u043b\u0438\u0442\u0435 \u0432\u0441\u0435 \u043f\u0440\u0430\u0432\u0438\u043b\u0430, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u043f\u0435\u0440\u0435\u043d\u0430\u043f\u0440\u0430\u0432\u043b\u044f\u044e\u0442 \u043f\u043e\u0440\u0442 9100 (\u0430 \u0442\u0430\u043a\u0436\u0435 515, 631) \u043d\u0430 \u043f\u0440\u0438\u043d\u0442\u0435\u0440. \u0415\u0441\u043b\u0438 \u043f\u0440\u0438\u043d\u0442\u0435\u0440 \u043d\u0430\u0445\u043e\u0434\u0438\u0442\u0441\u044f \u0432 \u00abDMZ\u00bb, \u0443\u0431\u0435\u0440\u0438\u0442\u0435 \u0438 \u0435\u0433\u043e."},
    {h: "\u0417\u0430\u0449\u0438\u0442\u0438\u0442\u0435 \u0441\u0430\u043c \u043f\u0440\u0438\u043d\u0442\u0435\u0440", b: "\u041e\u0442\u043a\u0440\u043e\u0439\u0442\u0435 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0443 \u043d\u0430\u0441\u0442\u0440\u043e\u0435\u043a \u043f\u0440\u0438\u043d\u0442\u0435\u0440\u0430 (\u043d\u0430\u0439\u0434\u0438\u0442\u0435 \u0435\u0433\u043e IP \u0432 \u0441\u043f\u0438\u0441\u043a\u0435 \u043a\u043b\u0438\u0435\u043d\u0442\u043e\u0432 \u0440\u043e\u0443\u0442\u0435\u0440\u0430 \u0438\u043b\u0438 \u0440\u0430\u0441\u043f\u0435\u0447\u0430\u0442\u0430\u0439\u0442\u0435 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0443 \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u044f \u0441\u0435\u0442\u0438). \u0421\u043c\u0435\u043d\u0438\u0442\u0435 \u043f\u0430\u0440\u043e\u043b\u044c \u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0430, \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0435 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u044e\u044e \u043f\u0440\u043e\u0448\u0438\u0432\u043a\u0443, \u0430 \u0435\u0441\u043b\u0438 \u0435\u0441\u0442\u044c \u00ab\u0424\u0438\u043b\u044c\u0442\u0440 IP\u00bb, \u00ab\u041a\u043e\u043d\u0442\u0440\u043e\u043b\u044c \u0434\u043e\u0441\u0442\u0443\u043f\u0430\u00bb \u0438\u043b\u0438 \u00ab\u0423\u0434\u0430\u043b\u0451\u043d\u043d\u043e\u0435 \u0443\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435\u00bb, \u0440\u0430\u0437\u0440\u0435\u0448\u0438\u0442\u0435 \u0442\u043e\u043b\u044c\u043a\u043e \u043b\u043e\u043a\u0430\u043b\u044c\u043d\u0443\u044e \u0441\u0435\u0442\u044c \u0438 \u0437\u0430\u043f\u0440\u0435\u0442\u0438\u0442\u0435 \u0434\u043e\u0441\u0442\u0443\u043f \u0438\u0437 WAN."},
    {h: "\u041f\u0435\u0447\u0430\u0442\u0430\u0439\u0442\u0435 \u0438\u0437\u0432\u043d\u0435 \u0431\u0435\u0437\u043e\u043f\u0430\u0441\u043d\u043e", b: "\u0415\u0441\u043b\u0438 \u043d\u0443\u0436\u043d\u043e \u043f\u0435\u0447\u0430\u0442\u0430\u0442\u044c \u0438\u0437-\u0437\u0430 \u043f\u0440\u0435\u0434\u0435\u043b\u043e\u0432 \u0434\u043e\u043c\u0430, \u043d\u0435 \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u0439\u0442\u0435 \u043f\u043e\u0440\u0442\u044b. \u0418\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0439\u0442\u0435 \u043e\u0431\u043b\u0430\u0447\u043d\u0443\u044e \u043f\u0435\u0447\u0430\u0442\u044c \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u0434\u0438\u0442\u0435\u043b\u044f \u0438\u043b\u0438 \u043d\u0430\u0441\u0442\u0440\u043e\u0439\u0442\u0435 VPN (WireGuard/OpenVPN) \u0438 \u043f\u0435\u0447\u0430\u0442\u0430\u0439\u0442\u0435 \u0442\u043e\u043b\u044c\u043a\u043e \u0447\u0435\u0440\u0435\u0437 VPN."},
    {h: "\u041f\u043e\u043c\u0435\u0441\u0442\u0438\u0442\u0435 \u043f\u0440\u0438\u043d\u0442\u0435\u0440 \u0432 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u0443\u044e \u0441\u0435\u0442\u044c", b: "\u0415\u0441\u043b\u0438 \u0440\u043e\u0443\u0442\u0435\u0440 \u044d\u0442\u043e \u043f\u043e\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0435\u0442, \u0441\u043e\u0437\u0434\u0430\u0439\u0442\u0435 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u0443\u044e \u0441\u0435\u0442\u044c (\u0433\u043e\u0441\u0442\u0435\u0432\u0443\u044e \u0438\u043b\u0438 VLAN) \u0434\u043b\u044f IoT-\u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432 \u0438 \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0438\u0442\u0435 \u043a \u043d\u0435\u0439 \u043f\u0440\u0438\u043d\u0442\u0435\u0440. \u0412\u044b\u0434\u0430\u0439\u0442\u0435 \u0435\u043c\u0443 \u0441\u0442\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 IP \u0438 \u0443\u0431\u0435\u0434\u0438\u0442\u0435\u0441\u044c, \u0447\u0442\u043e \u043d\u0438\u043a\u0430\u043a\u043e\u0439 \u043f\u0440\u043e\u0431\u0440\u043e\u0441 \u043f\u043e\u0440\u0442\u043e\u0432 \u043d\u0435 \u0443\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u043d\u0430 \u043d\u0435\u0433\u043e."}
  ],

  intro: "\u0625\u0630\u0627 \u0638\u0647\u0631\u062a \u0647\u0630\u0647 \u0627\u0644\u0635\u0641\u062d\u0629 \u0639\u0644\u0649 \u0637\u0627\u0628\u0639\u062a\u0643\u060c \u0641\u0647\u0630\u0627 \u064a\u0639\u0646\u064a \u0623\u0646 \u0627\u0644\u0637\u0627\u0628\u0639\u0629 \u0645\u062a\u0627\u062d\u0629 \u0645\u0646 \u0627\u0644\u0625\u0646\u062a\u0631\u0646\u062a \u0627\u0644\u0639\u0627\u0645 \u0639\u0628\u0631 \u0627\u0644\u0645\u0646\u0641\u0630 9100 (\u0627\u0644\u0637\u0628\u0627\u0639\u0629 \u0639\u0628\u0631 TCP). \u064a\u0633\u062a\u0637\u064a\u0639 \u0627\u0644\u0645\u0647\u0627\u062c\u0645\u0648\u0646 \u0623\u0648 \u0627\u0644\u0631\u0648\u0628\u0648\u062a\u0627\u062a \u0623\u0648 \u0627\u0644\u063a\u0631\u0628\u0627\u0621 \u0625\u0631\u0633\u0627\u0644 \u0645\u0647\u0627\u0645 \u0637\u0628\u0627\u0639\u0629 \u0625\u0644\u064a\u0647\u0627\u060c \u0648\u0625\u0647\u062f\u0627\u0631 \u0627\u0644\u0648\u0631\u0642 \u0648\u0627\u0644\u062d\u0628\u0631\u060c \u0623\u0648 \u0627\u0633\u062a\u062e\u062f\u0627\u0645\u0647\u0627 \u0641\u064a \u0647\u062c\u0645\u0627\u062a \u0623\u062e\u0631\u0649. \u0627\u0644\u062e\u0628\u0631 \u0627\u0644\u062c\u064a\u062f: \u0625\u0635\u0644\u0627\u062d \u0647\u0630\u0627 \u0627\u0644\u0623\u0645\u0631 \u0633\u0647\u0644.",
  steps: [
    {h: "\u0623\u0637\u0641\u0626 UPnP", b: "\u0633\u062c\u0651\u0644 \u0627\u0644\u062f\u062e\u0648\u0644 \u0625\u0644\u0649 \u0635\u0641\u062d\u0629 \u0625\u062f\u0627\u0631\u0629 \u0627\u0644\u0631\u0627\u0648\u062a\u0631 (\u0639\u0627\u062f\u0629 http://192.168.1.1 \u0623\u0648 http://192.168.0.1)\u060c \u0648\u0627\u0628\u062d\u062b \u0639\u0646 'UPnP' \u0648\u0623\u0637\u0641\u0626\u0647. \u062e\u0627\u0635\u064a\u0629 UPnP \u062a\u0633\u0645\u062d \u0644\u0644\u0623\u062c\u0647\u0632\u0629 \u0628\u0641\u062a\u062d \u0627\u0644\u0645\u0646\u0627\u0641\u0630 \u062a\u0644\u0642\u0627\u0626\u064a\u064b\u0627 \u0641\u064a \u0627\u0644\u0631\u0627\u0648\u062a\u0631 \u2014 \u0648\u0647\u0630\u0647 \u0628\u0627\u0644\u0636\u0628\u0637 \u0637\u0631\u064a\u0642\u0629 \u062a\u0639\u0631\u0651\u0636 \u0627\u0644\u0637\u0627\u0628\u0639\u0627\u062a \u0644\u0644\u0625\u0646\u062a\u0631\u0646\u062a."},
    {h: "\u0627\u062d\u0630\u0641 \u0642\u0648\u0627\u0639\u062f \u062a\u0648\u062c\u064a\u0647 \u0627\u0644\u0645\u0646\u0627\u0641\u0630", b: "\u0641\u064a \u0635\u0641\u062d\u0629 \u0625\u062f\u0627\u0631\u0629 \u0627\u0644\u0631\u0627\u0648\u062a\u0631\u060c \u0627\u0628\u062d\u062b \u0639\u0646 'Port Forwarding' \u0623\u0648 'Virtual Server' \u0623\u0648 'NAT'. \u0627\u062d\u0630\u0641 \u0623\u064a \u0642\u0627\u0639\u062f\u0629 \u062a\u0648\u062c\u0651\u0647 \u0627\u0644\u0645\u0646\u0641\u0630 9100 (\u0648\u0623\u064a\u0636\u064b\u0627 515 \u0648 631) \u0625\u0644\u0649 \u0627\u0644\u0637\u0627\u0628\u0639\u0629. \u0625\u0630\u0627 \u0643\u0627\u0646\u062a \u0627\u0644\u0637\u0627\u0628\u0639\u0629 \u0641\u064a 'DMZ' \u0641\u0623\u062e\u0631\u062c\u0647\u0627 \u0623\u064a\u0636\u064b\u0627."},
    {h: "\u0623\u0645\u0651\u0646 \u0627\u0644\u0637\u0627\u0628\u0639\u0629 \u0646\u0641\u0633\u0647\u0627", b: "\u0627\u0641\u062a\u062d \u0635\u0641\u062d\u0629 \u0625\u0639\u062f\u0627\u062f\u0627\u062a \u0627\u0644\u0637\u0627\u0628\u0639\u0629 (\u0627\u0628\u062d\u062b \u0639\u0646 \u0639\u0646\u0648\u0627\u0646 IP \u0641\u064a \u0642\u0627\u0626\u0645\u0629 \u0639\u0645\u0644\u0627\u0621 \u0627\u0644\u0631\u0627\u0648\u062a\u0631\u060c \u0623\u0648 \u0627\u0637\u0628\u0639 \u0635\u0641\u062d\u0629 \u062d\u0627\u0644\u0629 \u0627\u0644\u0634\u0628\u0643\u0629). \u063a\u064a\u0651\u0631 \u0643\u0644\u0645\u0629 \u0645\u0631\u0648\u0631 \u0627\u0644\u0645\u062f\u064a\u0631\u060c \u0648\u062b\u0628\u0651\u062a \u0622\u062e\u0631 \u062a\u062d\u062f\u064a\u062b \u0644\u0644\u0628\u0631\u0646\u0627\u0645\u062c \u0627\u0644\u062b\u0627\u0628\u062a\u060c \u0648\u0625\u0630\u0627 \u0643\u0627\u0646\u062a \u0647\u0646\u0627\u0643 \u0645\u064a\u0632\u0629 '\u062a\u0635\u0641\u064a\u0629 IP' \u0623\u0648 '\u0627\u0644\u062a\u062d\u0643\u0645 \u0641\u064a \u0627\u0644\u0648\u0635\u0648\u0644' \u0623\u0648 '\u0627\u0644\u0625\u062f\u0627\u0631\u0629 \u0639\u0646 \u0628\u0639\u062f'\u060c \u0627\u0633\u0645\u062d \u0628\u0627\u0644\u0634\u0628\u0643\u0629 \u0627\u0644\u0645\u062d\u0644\u064a\u0629 \u0641\u0642\u0637 \u0648\u0627\u0645\u0646\u0639 \u0627\u0644\u0648\u0635\u0648\u0644 \u0645\u0646 WAN."},
    {h: "\u0627\u0637\u0628\u0639 \u0645\u0646 \u0627\u0644\u062e\u0627\u0631\u062c \u0628\u0623\u0645\u0627\u0646", b: "\u0625\u0630\u0627 \u0643\u0646\u062a \u062a\u062d\u062a\u0627\u062c \u0641\u0639\u0644\u064a\u064b\u0627 \u0644\u0644\u0637\u0628\u0627\u0639\u0629 \u0645\u0646 \u062e\u0627\u0631\u062c \u0627\u0644\u0645\u0646\u0632\u0644\u060c \u0641\u0644\u0627 \u062a\u0641\u062a\u062d \u0627\u0644\u0645\u0646\u0627\u0641\u0630 \u0627\u0644\u062e\u0627\u0645. \u0627\u0633\u062a\u062e\u062f\u0645 \u0627\u0644\u0637\u0628\u0627\u0639\u0629 \u0627\u0644\u0633\u062d\u0627\u0628\u064a\u0629 \u0645\u0646 \u0627\u0644\u0634\u0631\u0643\u0629 \u0627\u0644\u0645\u0635\u0646\u0651\u0639\u0629\u060c \u0623\u0648 \u0623\u0639\u062f\u0651 VPN (WireGuard/OpenVPN) \u0648\u0627\u0637\u0628\u0639 \u0639\u0628\u0631 VPN \u0641\u0642\u0637."},
    {h: "\u0636\u0639 \u0627\u0644\u0637\u0627\u0628\u0639\u0629 \u0641\u064a \u0634\u0628\u0643\u0629 \u0645\u0633\u062a\u0642\u0644\u0629", b: "\u0625\u0630\u0627 \u0643\u0627\u0646 \u0627\u0644\u0631\u0627\u0648\u062a\u0631 \u064a\u062f\u0639\u0645 \u0630\u0644\u0643\u060c \u0623\u0646\u0634\u0626 \u0634\u0628\u0643\u0629 \u0645\u0646\u0641\u0635\u0644\u0629 (\u0634\u0628\u0643\u0629 \u0636\u064a\u0648\u0641 \u0623\u0648 VLAN) \u0644\u0623\u062c\u0647\u0632\u0629 \u0625\u0646\u062a\u0631\u0646\u062a \u0627\u0644\u0623\u0634\u064a\u0627\u0621 \u0648\u0648\u0635\u0651\u0644 \u0627\u0644\u0637\u0627\u0628\u0639\u0629 \u0628\u0647\u0627. \u0623\u0639\u0637\u0647\u0627 \u0639\u0646\u0648\u0627\u0646 IP \u062b\u0627\u0628\u062a\u064b\u0627 \u0648\u062a\u0623\u0643\u0651\u062f \u0645\u0646 \u0639\u062f\u0645 \u0648\u062c\u0648\u062f \u0623\u064a \u062a\u0648\u062c\u064a\u0647 \u0645\u0646\u0627\u0641\u0630 \u064a\u0634\u064a\u0631 \u0625\u0644\u064a\u0647\u0627."}
  ],
  close: "\u0647\u0630\u0627 \u0643\u0644 \u0634\u064a\u0621. \u062e\u0645\u0633 \u062f\u0642\u0627\u0626\u0642 \u0645\u0646 \u062a\u063a\u064a\u064a\u0631 \u0627\u0644\u0625\u0639\u062f\u0627\u062f\u0627\u062a \u0648\u0633\u062a\u062a\u0648\u0642\u0641 \u0627\u0644\u0637\u0627\u0628\u0639\u0629 \u0639\u0646 \u0643\u0648\u0646\u0647\u0627 \u0645\u0644\u0643\u064b\u0627 \u0644\u0644\u062c\u0645\u064a\u0639. \u0625\u0630\u0627 \u0643\u0627\u0646 \u0644\u062f\u064a\u0643 \u0641\u0631\u064a\u0642 \u062a\u0642\u0646\u064a \u0641\u0623\u0631\u0633\u0644 \u0644\u0647\u0645 \u0647\u0630\u0647 \u0627\u0644\u0635\u0641\u062d\u0629. \u2014 Friendly catgirl hacker:3"
},
"hi": {
  dir: "ltr",
  name: "\u0939\u093f\u0928\u094d\u0926\u0940",
  t: "\u0905\u092a\u0928\u0947 \u092a\u094d\u0930\u093f\u0902\u091f\u0930 \u0915\u094b \u0907\u0902\u091f\u0930\u0928\u0947\u091f \u0938\u0947 \u0915\u0948\u0938\u0947 \u0938\u0941\u0930\u0915\u094d\u0937\u093f\u0924 \u0915\u0930\u0947\u0902",
  sub: "\u092a\u094b\u0930\u094d\u091f 9100 \u0914\u0930 \u0930\u093e\u0909\u091f\u0930 \u0915\u0947 UPnP \u0915\u094b \u092c\u0902\u0926 \u0915\u0930\u0928\u0947 \u0915\u0940 \u091b\u094b\u091f\u0940 \u0917\u093e\u0907\u0921",
  intro: "\u0905\u0917\u0930 \u092f\u0939 \u092a\u0947\u091c \u0906\u092a\u0915\u0947 \u092a\u094d\u0930\u093f\u0902\u091f\u0930 \u092a\u0930 \u091b\u092a\u093e \u0939\u0948, \u0924\u094b \u0906\u092a\u0915\u093e \u092a\u094d\u0930\u093f\u0902\u091f\u0930 \u092a\u094b\u0930\u094d\u091f 9100 (RAW TCP \u092a\u094d\u0930\u093f\u0902\u091f\u093f\u0902\u0917) \u0915\u0947 \u091c\u093c\u0930\u093f\u090f \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0907\u0902\u091f\u0930\u0928\u0947\u091f \u0938\u0947 \u092a\u0939\u0941\u0902\u091a \u092f\u094b\u0917\u094d\u092f \u0939\u0948\u0964 \u0939\u092e\u0932\u093e\u0935\u0930, \u092c\u0949\u091f \u092f\u093e \u0905\u091c\u0928\u092c\u0940 \u0907\u0938\u092e\u0947\u0902 \u092a\u094d\u0930\u093f\u0902\u091f \u091c\u0949\u092c \u092d\u0947\u091c \u0938\u0915\u0924\u0947 \u0939\u0948\u0902, \u0915\u093e\u0917\u093c\u094b\u091c \u0914\u0930 \u091f\u094b\u0928\u0930 \u092c\u0930\u094d\u092c\u093e\u0926 \u0915\u0930 \u0938\u0915\u0924\u0947 \u0939\u0948\u0902, \u092f\u093e \u0907\u0938\u0947 \u0905\u0928\u094d\u092f \u0939\u092e\u0932\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0907\u0938\u094d\u0924\u0947\u092e\u093e\u0932 \u0915\u0930 \u0938\u0915\u0924\u0947 \u0939\u0948\u0902\u0964 \u0905\u091a\u094d\u091b\u0940 \u0916\u092c\u0930: \u0907\u0938\u0947 \u0920\u0940\u0915 \u0915\u0930\u0928\u093e \u0906\u0938\u093e\u0928 \u0939\u0948\u0964",
  steps: [
    {h: "UPnP \u092c\u0902\u0926 \u0915\u0930\u0947\u0902", b: "\u0930\u093e\u0909\u091f\u0930 \u0915\u0947 \u090f\u0921\u092e\u093f\u0928 \u092a\u0947\u091c (\u0906\u092e\u0924\u094c\u0930 \u092a\u0930 http://192.168.1.1 \u092f\u093e http://192.168.0.1) \u092e\u0947\u0902 \u0932\u0949\u0917 \u0907\u0928 \u0915\u0930\u0947\u0902, 'UPnP' \u0916\u094b\u091c\u0947\u0902 \u0914\u0930 \u0907\u0938\u0947 \u092c\u0902\u0926 \u0915\u0930 \u0926\u0947\u0902\u0964 UPnP \u0921\u093f\u0935\u093e\u0907\u0938\u094b\u0902 \u0915\u094b \u0930\u093e\u0909\u091f\u0930 \u092e\u0947\u0902 \u0905\u092a\u0928\u0947 \u0906\u092a \u092a\u094b\u0930\u094d\u091f \u0916\u094b\u0932\u0928\u0947 \u0926\u0947\u0924\u093e \u0939\u0948 \u2014 \u092a\u094d\u0930\u093f\u0902\u091f\u0930 \u0920\u0940\u0915 \u0907\u0938\u0940 \u0924\u0930\u0939 \u0907\u0902\u091f\u0930\u0928\u0947\u091f \u092a\u0930 \u090f\u0915\u094d\u0938\u092a\u094b\u091c\u093c \u0939\u094b \u091c\u093e\u0924\u0947 \u0939\u0948\u0902\u0964"},
    {h: "\u092a\u094b\u0930\u094d\u091f \u092b\u0949\u0930\u094d\u0935\u0930\u094d\u0921\u093f\u0902\u0917 \u0915\u0947 \u0928\u093f\u092f\u092e \u0939\u091f\u093e\u090f\u0901", b: "\u0930\u093e\u0909\u091f\u0930 \u090f\u0921\u092e\u093f\u0928 \u092e\u0947\u0902 'Port Forwarding', 'Virtual Server' \u092f\u093e 'NAT' \u0916\u094b\u091c\u0947\u0902\u0964 \u092a\u094b\u0930\u094d\u091f 9100 (\u0914\u0930 515, 631) \u0915\u094b \u0905\u092a\u0928\u0947 \u092a\u094d\u0930\u093f\u0902\u091f\u0930 \u092a\u0930 \u092d\u0947\u091c\u0928\u0947 \u0935\u093e\u0932\u0947 \u0938\u092d\u0940 \u0928\u093f\u092f\u092e \u0939\u091f\u093e \u0926\u0947\u0902\u0964 \u0905\u0917\u0930 \u092a\u094d\u0930\u093f\u0902\u091f\u0930 'DMZ' \u092e\u0947\u0902 \u0939\u0948 \u0924\u094b \u0909\u0938\u0947 \u092d\u0940 \u0935\u0939\u093e\u0901 \u0938\u0947 \u0928\u093f\u0915\u093e\u0932\u0947\u0902\u0964"},
    {h: "\u092a\u094d\u0930\u093f\u0902\u091f\u0930 \u0915\u094b \u0916\u0941\u0926 \u0938\u0941\u0930\u0915\u094d\u0937\u093f\u0924 \u0915\u0930\u0947\u0902", b: "\u092a\u094d\u0930\u093f\u0902\u091f\u0930 \u0915\u093e \u0938\u0947\u091f\u093f\u0902\u0917 \u092a\u0947\u091c \u0916\u094b\u0932\u0947\u0902 (\u0930\u093e\u0909\u091f\u0930 \u0915\u0940 \u0915\u094d\u0932\u093e\u0907\u0902\u091f \u0938\u0942\u091a\u0940 \u092e\u0947\u0902 \u0907\u0938\u0915\u093e IP \u0916\u094b\u091c\u0947\u0902, \u092f\u093e \u0928\u0947\u091f\u0935\u0930\u094d\u0915 \u0938\u094d\u091f\u0947\u091f\u0938 \u092a\u0947\u091c \u092a\u094d\u0930\u093f\u0902\u091f \u0915\u0930\u0947\u0902)\u0964 \u090f\u0921\u092e\u093f\u0928 \u092a\u093e\u0938\u0935\u0930\u094d\u0921 \u092c\u0926\u0932\u0947\u0902, \u0928\u0935\u0940\u0928\u0924\u092e \u092b\u093c\u0930\u094d\u092e\u0935\u0947\u092f\u0930 \u0907\u0902\u0938\u094d\u091f\u0949\u0932 \u0915\u0930\u0947\u0902, \u0914\u0930 \u0905\u0917\u0930 'IP \u092b\u093c\u093f\u0932\u094d\u091f\u0930', '\u090f\u0915\u094d\u0938\u0947\u0938 \u0915\u0902\u091f\u094d\u0930\u094b\u0932' \u092f\u093e '\u0930\u093f\u092e\u094b\u091f \u092e\u0948\u0928\u0947\u091c\u092e\u0947\u0902\u091f' \u0939\u0948 \u0924\u094b \u0915\u0947\u0935\u0932 \u0905\u092a\u0928\u0947 \u0932\u094b\u0915\u0932 \u0928\u0947\u091f\u0935\u0930\u094d\u0915 \u0915\u094b \u0905\u0928\u0941\u092e\u0924\u093f \u0926\u0947\u0902 \u0914\u0930 WAN \u0938\u0947 \u092a\u0939\u0941\u0902\u091a \u092c\u0902\u0926 \u0915\u0930\u0947\u0902\u0964"},
